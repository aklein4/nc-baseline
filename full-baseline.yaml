# Set secrets: kubectl create secret generic api-keys --from-env-file="$HOME/.config/nc-baseline/credentials.env" --dry-run=client -o yaml | kubectl apply -f -

# Run:   kubectl apply -f full-baseline.yaml
# Watch: kubectl logs -f job/full-baseline --pod-running-timeout=10m
# Clean: kubectl delete job full-baseline

apiVersion: batch/v1
kind: Job 

metadata:
  name: full-baseline

spec:

  backoffLimit: 0 # Do not retry a failed run automatically
  # 10 minutes was too tight for a diagnostic run: if the log stream drops at
  # the wrong moment the pod is garbage-collected before `kubectl logs` can
  # recover the evidence, and the whole run is wasted. 2h costs nothing (the
  # GPUs are released when the pod finishes, not when the record expires).
  ttlSecondsAfterFinished: 7200

  template:

    # not necessary, but good for organization
    metadata:
      labels: { app: nc-baseline }

    spec:

      restartPolicy: Never # Do not restart an exited container within this pod, async with backoff so must be set to avoid retrying
      terminationGracePeriodSeconds: 60 # Give the process 60s to checkpoint on a preemption SIGTERM before SIGKILL

      tolerations:
        - key: amd.com/gpu # Match the GPU-node taint used by the NC cluster
          operator: Exists # no specific value, just the presence of the taint key
          effect: NoSchedule # don't schedule any pods that don't match

      containers:
        - name: train

          # jax-aiter's Makefile can't find hipcc in the rocm/pytorch runtime
          # image (only the TheRock *dev* image wires hipcc through
          # rocm-sdk) -- switched to AMD's dev image for that reason.
          # Verified working (build + import) in a standalone diagnostic
          # job before this integration; see docs/worklog.md.
          image: ghcr.io/rocm/jax-dev-ubu24.therock-7.14:7.14

          resources:
            limits:
              amd.com/gpu: 8

          # DIAGNOSTIC RUN ONLY. py-spy attaches to the training process to
          # dump its Python stack while it's stalled -- that needs ptrace,
          # which Kubernetes drops by default. Without this the watcher loop
          # below still reports GPU power/util and kernel thread states, but
          # loses the single most useful signal (which Python frame is stuck).
          # Drop this block again once the stall is understood.
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]

          env: # Environment variables visible to the shell and its subprocesses.
            # send python stdout/stderr to kubectl logs promptly
            - name: PYTHONUNBUFFERED
              value: "1"
            # --- DIAGNOSTIC RUN ONLY: observation, no behaviour change ---
            # Deliberately NOT setting RCCL_MSCCL_ENABLE=0 or NCCL_ALGO here.
            # Those are fix attempts (see gpu-hang-debugging-log.md Part 7);
            # applying one now would confound this run, whose only job is to
            # capture what the stall actually looks like. Fix attempts come
            # after we know which hypothesis is right.
            #
            # RCCL logging. RCCL is AMD's port of NCCL and keeps NCCL's env
            # var names, so NCCL_DEBUG is the right knob -- there is no
            # RCCL_DEBUG. (It announces itself as
            # "NCCL INFO RCCL version : 2.27.7-HEAD" in our own v2 log.)
            #
            # Scoped to exclude TUNING specifically. TUNING is what produced
            # the 288MB log in debug-logs/full-baseline-run-v3.log: 132,483
            # pre/post/minNChannels triplets, emitted once per collective
            # call, which at 64 all-reduces/step adds up fast. INIT and ENV
            # fire once at communicator setup and stay small -- v2, which
            # logged everything, is only 6,219 lines total.
            #
            # INIT is the one that matters here: RCCL's MSCCL lines
            # ("MSCCL: No external scheduler found, using internal
            # implementation") are emitted at init, so this shows whether
            # MSCCL -- the culprit in the original Part 4 hang -- is active
            # under this image at all.
            - name: NCCL_DEBUG
              value: "INFO"
            # Everything except TUNING (the per-collective firehose that made
            # v3 288MB). Scoping to INIT,ENV last run was too tight: it showed
            # zero MSCCL lines, which we could not read as "MSCCL is off"
            # because the filter may simply have excluded them.
            - name: NCCL_DEBUG_SUBSYS
              value: "ALL,^TUNING"
            # THE ONE VARIABLE UNDER TEST this run. Part 7 of
            # gpu-hang-debugging-log.md found this independently sufficient to
            # fix a hang with exactly the signature we just reproduced
            # (GPUs pegged, no progress, host blocked in device_get). It was
            # dropped as unnecessary on rocm7.14.1/jax0.10.0, but this is a
            # different image and JAX, so that ruling never applied here.
            - name: RCCL_MSCCL_ENABLE
              value: "0"
            # KEEP THIS. Level 1 is HIP errors only, and it is not noise: it
            # revealed ~3,900/sec of "UpdateStreams failed" from
            # hip_graph_internal.cpp, firing once per HIP-graph launch right
            # up to 11s after the last completed step and then stopping dead
            # at the hang. That error has been present in every previous run;
            # we simply never had error logging on to see it. XLA wraps
            # collectives in command buffers (HIP graphs), so this sits
            # exactly where a collective that never completes would.
            # Costs ~1GB of log per hour -- worth it, grep past it.
            - name: AMD_LOG_LEVEL
              value: "1"
            # Silence aiter's benign fwd_v3 warning without hiding real
            # errors. Source: third_party/aiter/csrc/cpp_itfs/mha_fwd.cu:222
            #   AITER_LOG_WARNING("unsupported condition in fwd_v3!!! ...")
            # which is gated in csrc/include/aiter_logger.h by
            #   getenv("AITER_LOG_LEVEL")   default LOG_INFO(20)
            #   AITER_LOG_WARNING prints when level <= LOG_WARNING(30)
            # so ERROR(40) suppresses it while AITER_LOG_ERROR still prints.
            #
            # Why bother: it fires once per attention call and produced
            # ~570,000 lines in 37 steps with command buffers disabled
            # (~15,400/step), which buries everything else. The warning
            # itself is expected and understood -- head_dim=64 doesn't match
            # the ASM-v3 kernel's supported dims (128/128, 192/128, 256/256),
            # so it falls back to the Composable Kernel path. Correct, just
            # not the fastest kernel.
            #
            # It is emitted from C++ to std::cerr, so Python logging config
            # cannot suppress it. The level is cached in a function-local
            # static on first use, so this must be set before the first call.
            - name: AITER_LOG_LEVEL
              value: "ERROR"
            # Belt-and-braces with the watchdog in utils/data_utils.py: make
            # the HTTP layer itself give up on a stalled Hub read rather than
            # relying only on our timeout to notice. A raised error retries
            # and resumes; a silent hang only gets caught by the watchdog.
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "60"
            # Which physical node actually ran this -- printed in the
            # diagnostics block below. Node identity/hardware isn't
            # guaranteed stable run-to-run on this marketplace, and we've
            # lost hours before to a run silently landing on different
            # hardware than a prior "working" run with no record of either.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Node name alone isn't a reliable hardware identity: names on
            # this marketplace could be reused for different physical
            # machines over time. hostIP disambiguates that; GPU uniqueId
            # (below, from rocm-smi) is the strongest signal since it's
            # tied to the actual silicon.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # NOTE: no LLVM_PATH/LD_LIBRARY_PATH override here (unlike the
            # rocm/pytorch runtime images) -- this dev image's system-wide
            # _rocm_sdk_core is registered via ldconfig, confirmed working
            # in the standalone build diagnostic without one. Our own
            # uv-managed .venv installs a SEPARATE copy of _rocm_sdk_core
            # that ldconfig won't know about -- verify `jax.devices()` via
            # kubectl exec once the pod is up; add an override pointing at
            # .venv/lib/python3.12/site-packages/_rocm_sdk_{core,libraries}/lib
            # if devices aren't found.
            # access the api keys stored in the cluster's secret
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: HF_TOKEN
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: WANDB_API_KEY
            - name: HF_ID
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: HF_ID

          volumeMounts:
            # RCCL (ROCm's NCCL) moves tensors between the 8 ranks through
            # /dev/shm; the kubernetes default of 64Mi is far too small and
            # fails at startup
            - name: shm
              mountPath: /dev/shm
            # the cluster's shared volume, mounted at the same path on every
            # node (see the volume below)
            - name: shared # this much match volume name below
              mountPath: /mnt/shared

          workingDir: /workspace # Initial directory for the startup shell

          command: ["bash", "-c"] # execute a shell string.
          args:
            - | # YAML literal block preserves the shell script newlines.
              
              set -euxo pipefail

              # Node/GPU diagnostics, first thing, so a run that behaves
              # differently than a prior one has something to compare
              # against without needing a live kubectl exec investigation.
              # Runs before anything else can fail. `|| true` on every
              # rocm-smi call: a diagnostics hiccup must never abort the job.
              echo "=== node: ${NODE_NAME} (${NODE_IP}) | $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              echo "=== host kernel/OS ==="
              uname -a || true
              echo "=== GPU product / firmware ==="
              rocm-smi --showproductname --showuniqueid --showvbios --showdriverversion || true
              echo "=== GPU topology (link type / hops) ==="
              rocm-smi --showtopo || true
              echo "=== GPU concise status (temp/clock/power/util) ==="
              rocm-smi || true
              echo "=== RAS/ECC error counts ==="
              rocm-smi --showrasinfo all || true
              echo "=== end diagnostics ==="

              # Pinned to this experiment branch so main stays on the
              # confirmed rocm10.0/jax==0.11.2 baseline while this
              # rocm7.14-GA/jax==0.11.0 combo is being tried.
              git clone -b experiment/rocm714-ga-jax0110 https://github.com/aklein4/nc-baseline.git
              cd nc-baseline

              python3 -m pip install "uv==$(cat .uv-version)"

              uv sync --locked --extra rocm --no-dev --python "$(cat .python-version)"

              # Build jax-aiter from source into the SAME venv training uses,
              # so `from jax_aiter.mha import flash_attn_func` (already in
              # src/utils/attention_utils.py) resolves at train time.
              # release/v0.1.0-alpha2 targets exactly the jax==0.11.0 pinned
              # above. Verified end-to-end in a standalone diagnostic job
              # first (docs/worklog.md) -- this repeats those exact steps.
              # `source .venv/bin/activate` makes plain python3/make resolve
              # inside the venv (needed for the Makefile's internal python3
              # calls). uv-managed venvs have no `pip` module at all, though
              # -- use `uv pip install` (targets $VIRTUAL_ENV, set by the
              # activate script above) for every install from here on.
              source .venv/bin/activate
              uv pip install cmake ninja pyyaml zstandard pandas

              git clone --recursive -b release/v0.1.0-alpha2 https://github.com/ROCm/jax-aiter.git
              (
                cd jax-aiter
                export JA_ROOT_DIR="$PWD"
                export GPU_ARCHS=gfx950
                export AITER_SYMBOL_VISIBLE=1

                # Downloads AMD's prebuilt MHA/rmsnorm JIT libs (matches this
                # branch's pinned aiter submodule commit exactly) instead of
                # the multi-hour from-scratch JIT build.
                bash ci/fetch_jit_libs.sh

                make
                make ja_mods
                JA_WHEEL_VARIANT=full uv pip install .
              )
              python3 -c "from jax_aiter.mha import flash_attn_func; print('JAX-AITER: OK')"

              # =============================================================
              # DIAGNOSTIC BLOCK -- capture what the step-18 stall actually
              # is. Pure observation: nothing here changes what the training
              # run computes or which kernels it picks. Remove once resolved.
              # =============================================================

              uv pip install py-spy

              # (1) Duplicate-ROCm-runtime check, the leading hypothesis.
              # Our uv venv installs its own _rocm_sdk_core (pulled in by
              # jax-rocm7-plugin), while jax-aiter is compiled against the
              # image's SYSTEM ROCm -- which is the whole reason we're on the
              # dev image. If both get mapped into one process, two copies of
              # libamdhip64/librccl/libhsa end up managing the same streams,
              # events and signals: a textbook "runs fine for a while, then
              # wedges with the GPUs spinning" bug. AITER_SYMBOL_VISIBLE=1
              # (set in the build above) makes interposition more likely still.
              # READING THIS: any library below appearing at TWO different
              # paths is the finding. Runs in a throwaway process first so it
              # cannot perturb training.
              cat > /tmp/rocm_dup_check.py <<'PY'
              import re
              import jax
              print("devices:", jax.devices())
              from jax_aiter.mha import flash_attn_func  # noqa: F401
              pattern = re.compile(r"libamdhip64|librccl|libhsa-runtime|libamd_comgr|libmha|librocm")
              paths = set()
              for line in open("/proc/self/maps"):
                  fields = line.split()
                  if len(fields) >= 6 and pattern.search(fields[-1]):
                      paths.add(fields[-1])
              print("=== ROCm libraries mapped into a single process ===")
              for path in sorted(paths):
                  print("   ", path)
              PY
              python3 /tmp/rocm_dup_check.py || true

              # (2) Probe which XLA flags this build actually accepts.
              # DO NOT use `XLA_FLAGS=--help` to enumerate them: on this build
              # it prints only ~94 lines (mostly CPU flags) and then dies with
              # "Flag parsing failed", so a name being absent from that dump
              # proves nothing. Guessing from it produced two wrong names.
              # Instead, actually try each candidate in a throwaway process --
              # an unrecognized flag aborts startup, so "the process started"
              # is a definitive yes and costs one short run each.
              xla_flag_works() {
                XLA_PYTHON_CLIENT_PREALLOCATE=false XLA_FLAGS="$1" \
                  python3 -c 'import jax; jax.devices()' >/dev/null 2>&1
              }
              echo "=== probing XLA flag support (definitive, not --help) ==="
              EXTRA_XLA=""
              for candidate in \
                  --xla_gpu_nccl_termination_timeout_seconds=900 \
                  --xla_gpu_collective_timeout_seconds=900 ; do
                if xla_flag_works "$candidate"; then
                  echo "  SUPPORTED: $candidate"
                  EXTRA_XLA="$EXTRA_XLA $candidate"
                else
                  echo "  rejected:  $candidate"
                fi
              done
              # Probed but deliberately NOT applied this run -- disabling
              # command buffers is the next hypothesis after MSCCL, and
              # changing two things at once is how Part 6 ended up unable to
              # say which fix mattered. We only want to learn the valid
              # spelling now, so the next run can use it without guessing.
              for candidate in \
                  --xla_gpu_enable_command_buffer= \
                  --xla_gpu_graph_min_graph_size=2147483647 ; do
                if xla_flag_works "$candidate"; then
                  echo "  SUPPORTED (saved for next run, not applied): $candidate"
                else
                  echo "  rejected (not a valid flag here): $candidate"
                fi
              done
              # Dump the compiled HLO. This costs compile time only -- zero
              # runtime overhead, so it cannot perturb the race we're trying
              # to reproduce. Pays for the worklog's open item #2: Part 14
              # established "64 all-reduces per step" from a CPU simulation
              # (--xla_force_host_platform_device_count=8), never from the
              # real compiler on real hardware. The watcher summarises the
              # optimized module below, which either confirms that number and
              # gives real byte sizes, or shows the GPU compiler does
              # something different -- either way it's the input to deciding
              # whether perf/gradient-sync-shard-map is worth landing.
              mkdir -p /tmp/hlo
              EXTRA_XLA="$EXTRA_XLA --xla_dump_to=/tmp/hlo --xla_dump_hlo_as_text"

              echo "=== extra XLA flags for this run: '${EXTRA_XLA}' ==="
              export XLA_FLAGS="${XLA_FLAGS:-}${EXTRA_XLA}"

              # (3) Heartbeat watcher. The stall is silent by construction:
              # base_trainer.py only logs AFTER a step completes, so a frozen
              # run emits nothing at all and we learn nothing from the log.
              # Every 60s this prints the three things that separate the
              # hypotheses from each other:
              #   - power vs. util: a spin-waiting collective pegs util at
              #     100% while drawing well under TDP; genuine compute draws
              #     near TDP. rocm-smi's "GPU use" only means a kernel is
              #     resident, so power is the honest signal.
              #   - py-spy stack: a frame in next(iterator) or a socket read
              #     means the host is stuck fetching streaming data; a frame
              #     in device_get/PJRT means the device is stuck.
              #   - mapped ROCm library paths, for the REAL training process
              #     rather than the throwaway probe in (1).
              # Survives the exec below (separate process, same stdout) and
              # dies with the pod when training exits.
              (
                set +x
                set +e
                HLO_SUMMARISED=""
                while true; do
                  sleep 60
                  PID=""
                  for candidate in $(pgrep -f 'src/train.py' 2>/dev/null); do
                    case "$(cat /proc/$candidate/comm 2>/dev/null)" in
                      python*) PID="$candidate"; break;;
                    esac
                  done
                  echo "=== WATCH $(date -u +%H:%M:%SZ) pid=${PID:-none} ==="
                  # VRAM alongside power/util: HBM headroom is the input to
                  # every "can we go bigger/faster" question (batch size,
                  # num_logit_iterations), and no run so far has logged it
                  # except the old one-off *-vram.log captures.
                  rocm-smi --showuse --showpower --showmemuse --showmeminfo vram \
                    2>/dev/null | grep -Ei 'gpu|use|power|vram|memory' | head -40
                  # Wait for the TRAIN STEP module specifically, and keep
                  # retrying until it exists. Last run this took `ls -1t |
                  # head -1` on the first heartbeat, which fired during the
                  # initial compile and picked up a trivial module -- the
                  # summary came out empty and, being one-shot, never retried.
                  if [ -z "$HLO_SUMMARISED" ]; then
                    MODULE=$(ls -S /tmp/hlo/*jit__train_step*after_optimizations.txt \
                      2>/dev/null | head -1)
                    if [ -n "$MODULE" ]; then
                      echo "--- collectives in optimized HLO ($MODULE) ---"
                      grep -oE '\b(all-reduce|all-gather|reduce-scatter|collective-permute|all-to-all)(-start|-done)?\b' \
                        "$MODULE" | sort | uniq -c | sort -rn
                      echo "--- all-reduce operand shapes (size of each sync) ---"
                      grep -oE '= *\(?(f32|bf16|f16)\[[0-9,]*\][^=]*all-reduce' "$MODULE" \
                        | grep -oE '(f32|bf16|f16)\[[0-9,]*\]' | sort | uniq -c | sort -rn | head -20
                      HLO_SUMMARISED=1
                    fi
                  fi
                  [ -z "$PID" ] && continue
                  echo "--- ROCm libs mapped in the training process ---"
                  grep -oE '/[^ ]*(libamdhip64|librccl|libhsa-runtime|libmha)[^ ]*' \
                    /proc/$PID/maps | sort -u
                  echo "--- python stack ---"
                  py-spy dump --pid "$PID" 2>&1 | head -80
                  echo "--- thread count in GPU-driver wait (kfd_wait_on_events) ---"
                  grep -l kfd_wait_on_events /proc/$PID/task/*/stack 2>/dev/null | wc -l
                done
              ) &

              # exec replaces Bash with the launcher so its exit status is the job's
              # --no-sync to avoid messing with the uv env since rocm is not specified in run
              exec uv run --no-sync python src/train.py \
                --config-name=horizon-lm-mi-8 \
                name=full-baseline \
                distributed.initialize=false \
                model.attention_backend=auto
                
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
        - name: shared
          # no `type`: a node without the shared volume must not fail the
          # job — the script checks what is mounted and skips the file
          hostPath:
            path: /mnt/shared

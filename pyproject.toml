[project]
name = "outer-loop-jax"
version = "0.1.0"
description = "Small JAX training code for ML experiments."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=4.0.0",
    "flax>=0.12.0",
    "huggingface-hub>=0.34.0",
    "hydra-core>=1.3.2",
    "jax>=0.8.0",
    "jinja2>=3.1.0",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.11.20",
    "python-dotenv>=1.1.0",
    "safetensors>=0.6.0",
    "tqdm>=4.67.0",
    "transformers>=4.55.0",
    "wandb>=0.21.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.8.0"]
cuda13 = ["jax[cuda13]>=0.8.0"]
rocm = [
    "jax[rocm7-local]>=0.8.0",
    # Full MI355X/gfx950 wheel, including FlashAttention and GEMM bindings.
    "jax-aiter @ https://github.com/ROCm/jax-aiter/releases/download/v0.1.0-alpha/jax_aiter-0.1.0a0-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
tpu = ["jax[tpu]>=0.8.0"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "outer-loop-jax"
version = "0.1.0"
description = "Small JAX training code for ML experiments."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.0.0",
    # flax<0.12.7 calls the jax.core.get_opaque_trace_state API that JAX
    # removed in 0.11.0.
    "flax>=0.12.7",
    "huggingface-hub>=0.34.0",
    "hydra-core>=1.3.2",
    "jax>=0.8.0",
    "jinja2>=3.1.0",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.11.20",
    "python-dotenv>=1.1.0",
    "safetensors>=0.6.0",
    "tqdm>=4.67.0",
    "transformers>=4.55.0",
    "wandb>=0.21.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.8.0"]
cuda13 = ["jax[cuda13]>=0.8.0"]
rocm = [
    # Experiment branch: ROCm 7.14 GA / jax 0.11.0. This is the exact stack
    # jax-aiter's release/v0.1.0-alpha2 branch README declares as its one
    # tested target (github.com/ROCm/jax-aiter) -- aiter's own wheel isn't
    # published yet (from-source only), but pinning this combo now means
    # we're ready the moment it is, without another version hunt.
    "jax==0.11.0",
    "jaxlib==0.11.0",
    "jax-rocm7-pjrt==0.11.0.post1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-rocm7-plugin==0.11.0.post1 ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
tpu = ["jax[tpu]>=0.8.0"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

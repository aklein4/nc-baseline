defaults:
    - llama3p2-1b
    - _self_

vocab_size: 256
hidden_size: 64
intermediate_size: 128
num_hidden_layers: 2
num_attention_heads: 4
num_key_value_heads: 2
head_dim: 16
max_position_embeddings: 128
rope:
    factor: 1.0
    original_context_len: 128
compute_dtype: float32
gradient_checkpointing: false
attention_backend: portable

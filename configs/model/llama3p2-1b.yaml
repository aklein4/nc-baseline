defaults:
    - sharding: fsdp
    - _self_

_target_: models.llama.LlamaForCausalLM
vocab_size: 128256
pad_token_id: -100
hidden_size: 2048
intermediate_size: 8192
num_hidden_layers: 16
num_attention_heads: 32
num_key_value_heads: 8
head_dim: 64
max_position_embeddings: 131072
rope:
    theta: 500000.0
    factor: 32.0
    high_freq_factor: 4.0
    low_freq_factor: 1.0
    original_context_len: 8192
rms_norm_eps: 1.0e-5
compute_dtype: bfloat16
gradient_checkpointing: true
attention_backend: portable

# Hyperparameters from https://wandb.ai/aklein4/horizon-v2/runs/op8f1j6t
global_batch_size: 128
max_steps: 1000000
num_logit_iterations: 4
aux_loss_weight: 0.1
max_grad_norm: 1.0
debug: false
checkpoint:
    interval: 50
wandb:
    enabled: true
huggingface:
    enabled: true
groups:
    slow:
        _target_: optax.adamw
        lr: 3.0e-5
        b1: 0.9
        b2: 0.95
        eps: 1.0e-6
        weight_decay: 0.0
        warmup_steps: 100
        stable_steps: 899900
        decay_steps: 100000
        min_lr_ratio: 0.0
